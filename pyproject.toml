[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dora-bench"
version = "1.0.0"
description = "DORA: benchmarking LLM agents on heterogeneous geospatial reasoning for disaster response (NeurIPS 2026)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
authors = [{ name = "DORA authors" }]
# PyTorch is installed separately (CUDA-specific wheels), see README. Exact pins below are the
# tested set; requirements.txt locks the full dependency tree.
dependencies = [
    # agent / MCP
    "langchain-core==1.2.28",
    "langgraph==1.1.6",
    "langchain-mcp-adapters==0.2.2",
    "langchain-openai==1.1.12",
    "langchain-google-genai==4.2.1",
    "mcp==1.27.0",
    "fastmcp==3.2.3",
    "pydantic==2.12.5",
    "openai==2.31.0",
    "google-genai==1.72.0",
    # raster / vector
    "numpy==2.4.4",
    "scipy==1.17.1",
    "pandas==3.0.2",
    "scikit-image==0.26.0",
    "pillow==12.2.0",
    "tifffile==2026.3.3",
    "imagecodecs==2026.3.6",  # LZW/JPEG-compressed GeoTIFFs
    "matplotlib==3.10.8",
    "networkx==3.6.1",
    "shapely==2.1.2",
    "geopandas==1.1.3",
    "pyogrio==0.12.1",
    "pyproj==3.7.2",
    "rasterio==1.4.4",
    # perception models
    "albumentations==2.0.8",
    "timm==1.0.26",
    "einops==0.8.2",
    "safetensors==0.7.0",
    # data download
    "huggingface-hub==1.10.1",
    "py7zr==1.1.0",  # official GVLM archive
]

[project.urls]
Homepage = "https://github.com/Junjue-Wang/DORA"
Paper = "https://arxiv.org/abs/2605.11633"

[tool.setuptools.packages.find]
include = ["dora*"]

[tool.setuptools.package-data]
"dora.tools.segmentation.dinov3" = ["LICENSE"]
"dora.tools.segmentation.segformer" = ["LICENSE"]
